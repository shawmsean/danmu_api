name: Merge Sync Upstream (Preserve Local Workflows)

on:
  schedule:
    - cron: '0 2 * * *'   # 每天凌晨 2 点（UTC）自动运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone your repo with PAT
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/shawmsean/danmu_api.git repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        working-directory: repo
        run: |
          git remote add upstream https://github.com/huangxd-/danmu_api.git || true
          git fetch upstream

      - name: Merge upstream into local
        working-directory: repo
        run: |
          git checkout main
          git merge upstream/main --no-edit || true

      - name: Detect merge conflicts
        working-directory: repo
        run: |
          echo "=== 检查是否存在合并冲突 ==="
          if git ls-files -u | grep -q .; then
            echo "⚠️ 检测到合并冲突，请手动处理以下文件："
            git ls-files -u | cut -f 2 | sort -u
            exit 1
          else
            echo "✅ 没有检测到合并冲突"
          fi

      - name: Preserve local workflows
        working-directory: repo
        run: |
          echo "=== 保留本地 .github/workflows 文件 ==="
          git checkout --ours .github/workflows || true
          git add .github/workflows
          git commit -m "Preserve local workflows directory" || true

      - name: Show commit log
        working-directory: repo
        run: |
          echo "=== 当前同步到的 commit ==="
          git log -3 --oneline

      - name: Push changes (merge with PAT)
        working-directory: repo
        run: |
          echo "=== 使用 PAT 推送合并后的 main 分支 ==="
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/shawmsean/danmu_api.git HEAD:main

      - name: Trigger Vercel Deploy
        run: |
          echo "=== 正在触发 Vercel 部署 ==="
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
